name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run a quick syntax check
        run: |
          python -m py_compile app.py metadata_inference.py pipeline_logic.py cleaningDecisionTree.py

# Deployment happens automatically via Render's own auto-deploy (see render.yaml,
# autoDeployTrigger: commit) on every push to main. The previous SSH-deploy job here
# targeted a self-hosted DigitalOcean droplet that has since been decommissioned, so
# it was removed to stop CI from reporting a false failure on every commit.